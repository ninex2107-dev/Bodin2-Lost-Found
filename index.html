<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODIN 2 Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/th/thumb/f/f6/Bodin_decha_logo.png/600px-Bodin_decha_logo.png" alt="Logo">
                <span>BODIN 2 <span class="highlight">Lost & Found</span></span>
            </a>
            <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
            <ul class="nav-links" id="navLinks">
                <li><a href="#home">หน้าแรก</a></li>
                <li><a href="#items-section">ของหาย</a></li>
                <li><a href="#items-section">ของที่พบ</a></li>
                <li><a href="#post-section">ลงประกาศ</a></li>
            </ul>
        </div>
    </nav>

    <header id="home" class="hero">
        <div class="hero-content">
            <h1>ตามหาของที่หาย <br><span class="highlight">ได้ที่นี่</span></h1>
            <p>ระบบแจ้งและค้นหาสิ่งของสูญหายภายในโรงเรียนบดินทรเดชา (สิงห์ สิงหเสนี) ๒</p>
            <div class="hero-search">
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อสิ่งของ...">
            </div>
            <div class="hero-buttons">
                <a href="#post-section" class="btn-primary">ลงประกาศ</a>
            </div>
        </div>
    </header>

    <section id="items-section" class="items-section">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
            <button class="filter-btn" data-filter="lost">ของหาย</button>
            <button class="filter-btn" data-filter="found">ของที่พบ</button>
        </div>
        <div class="cards-grid" id="cardsContainer"></div>
    </section>

    <section id="post-section" class="post-section">
        <div class="form-container">
            <h2>ลงประกาศสิ่งของ</h2>
            <form id="postForm">
                <div class="radio-group">
                    <label><input type="radio" name="itemType" value="lost" checked> ของหาย</label>
                    <label><input type="radio" name="itemType" value="found"> ของที่พบ</label>
                </div>
                <input type="text" id="itemName" placeholder="ชื่อสิ่งของ *" required>
                <input type="text" id="itemLocation" placeholder="สถานที่ *" required>
                <input type="date" id="itemDate" required>
                <textarea id="itemDetails" placeholder="รายละเอียดเพิ่มเติม"></textarea>
                <input type="text" id="itemContact" placeholder="ช่องทางติดต่อ *" required>
                <button type="submit" class="btn-primary w-100">ส่งประกาศ</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
